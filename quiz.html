<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>BTS Quiz</title>

<link rel="icon" href="1609222921_8875.jpg">

<style>
body{
  background:linear-gradient(
    135deg,
    #B15BFF,
    #BE77FF,
    #CA8EFF,
    #D3A4FF,
    #DCB5FF,
    #E6CAFF
  );
}
    color:#4A235A;
    font-family:"Microsoft JhengHei";
    text-align:center;
    padding:30px;
}

.box{
    max-width:800px;
    margin:auto;
    background:rgba(255,255,255,0.45);
    padding:30px;
    border-radius:20px;
}

button{
    margin-top:20px;
    padding:10px 30px;
    border:none;
    border-radius:20px;
    cursor:pointer;
}

label{
    display:block;
    width:fit-content;
    margin:12px auto;
    text-align:left;
    font-size:18px;
}
.progress-container{
    width:100%;
    height:20px;
    background:rgba(255,255,255,0.3);
    border-radius:20px;
    overflow:hidden;
    margin-bottom:20px;
}

#progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(
        90deg,
        #c77dff,
        #e0aaff
    );
    transition:0.4s;
}
</style>
</head>

<body>

<div class="box">

<div class="progress-container">
    <div id="progress-bar"></div>
</div>

<h2 id="progress"></h2>

<h3 id="question"></h3>

<div id="choices"></div>

<button onclick="nextQuestion()">
下一題
</button>

</div>

<script>

const questions = [

{
question:"BTS的大哥是誰？",
choices:["JIN","RM","SUGA","J-HOPE"],
answer:"JIN"
},

{
question:"BTS的隊長是誰？",
choices:["RM","Jimin","JIN","V"],
answer:"RM"
},

{
question:"BTS的門面是誰？",
choices:["V","JIN","JungKook","Jimin"],
answer:"JIN"
},

{
question:"BTS出道日期是？",
choices:["2012.05.13","2013.06.12","2015.05.26","2013.06.13"],
answer:"2013.06.13"
},

{
question:"BTS團名的涵義是什麼？",
choices:[
"阻擋像子彈一樣地批評與時代偏見",
"不畏懼他人眼光，成為獨一無二的自己",
"衝破障礙，感受青春的每個瞬間",
"在一切為時已晚之前，必須找到屬於自己的幸福"
],
answer:"阻擋像子彈一樣地批評與時代偏見"
},

{
question:"BTS的粉絲名A.R.M.Y的涵義是什麼？",
choices:[
"值得人們景仰的青年代表",
"與BTS一起守護夢想的夥伴",
"永遠支持BTS的音樂與理念之人",
"青春與熱情的象徵團體"
],
answer:"值得人們景仰的青年代表"
},

{
question:"《花樣年華 pt.1》主打曲為下列何者？",
choices:["I NEED U","Dope","Fire","RUN"],
answer:"I NEED U"
},

{
question:"BTS在The Show上獲得首個冠軍頭銜的主打單曲是什麼？",
choices:["I NEED U","Dope","Fire","Blood Sweat & Tears"],
answer:"I NEED U"
},

{
question:"BTS的首張正規專輯是？",
choices:["O!RUL8,2?","DARK & WILD","Skool Luv Affair","2 COOL 4 SKOOL"],
answer:"DARK & WILD"
},

{
question:"BTS第一位和最後一位加入的成員分別是哪兩位？",
choices:[
"RM；JIN",
"Suga；JungKook",
"RM；Jimin",
"Suga；V"
],
answer:"RM；Jimin"
},

{
question:"『Dynamite』的MV花了多少小時在YouTube上達到1億的流覽量？",
choices:["27","17","24","25"],
answer:"24"
},

{
question:"下列哪個為防彈少年團獲得出道後觀看次數首次破億的Youtube MV？",
choices:["I NEED U","Dope","Fire","Blood Sweat & Tears"],
answer:"Dope"
},

{
question:"ARMY的官方生日是什麼時候？",
choices:["2013.07.09","2014.07.07","2013.07.07","2014.07.13"],
answer:"2013.07.09"
},

{
question:"在BTS成員中，誰不喜歡吃豆子？",
choices:["V","Jimin","Suga","JungKook"],
answer:"V"
},

{
question:"『Hey！Stop it！』是哪位成員在直播中說過的名言？",
choices:["JIN","Jimin","V","JungKook"],
answer:"JIN"
},

{
question:"香蕉事件的主人公是哪兩位？",
choices:[
"V；JIN",
"J-Hope；JungKook",
"Jimin；JungKook",
"Jimin；V"
],
answer:"J-Hope；JungKook"
},

{
question:"『花開CP』指的是哪兩位成員？",
choices:[
"J-Hope；Jimin",
"Suga；J-Hope",
"Jimin；JungKook",
"Suga；V"
],
answer:"Suga；J-Hope"
},

{
question:"JungKook經常說的『阿永彈永』後面的下一句是？",
choices:[
"阿無幸知",
"防無幸知",
"紫愛你",
"我現花"
],
answer:"阿無幸知"
},

{
question:"在RUN BTS!睡衣派對中穿著桑拿服的是哪位成員？",
choices:["RM","Jimin","Suga","JungKook"],
answer:"RM"
},

{
question:"下列何者為SUGA公佈過的特技？",
choices:[
"能把元素週期表都背下來",
"會發出豪宅的門鈴聲",
"會學海綿寶寶的聲音",
"吃芥末不會流眼淚"
],
answer:"會發出豪宅的門鈴聲"
}

];

let current = 0;
let score = 0;

// 打亂題目順序
questions.sort(() => Math.random() - 0.5);

showQuestion();

function showQuestion(){

document.getElementById("progress").innerHTML =
`第 ${current+1} 題 / ${questions.length} 題`;

let percent =
((current)/questions.length)*100;

document.getElementById("progress-bar").style.width =
percent + "%";

document.getElementById("question").innerHTML =
questions[current].question;

let html="";

questions[current].choices.forEach(choice=>{

html += `
<label>
<input type="radio"
name="answer"
value="${choice}">
${choice}
</label>
`;

});

document.getElementById("choices").innerHTML = html;

}

function nextQuestion(){

    let selected =
    document.querySelector('input[name="answer"]:checked');

    if(!selected){
        alert("請選擇答案！");
        return;
    }

    if(selected.value === questions[current].answer){
        score++;
    }

    current++;

    if(current < questions.length){

        showQuestion();

    }else{

        localStorage.setItem("score", score);

        location.href = "result.html";

    }

}

</script>

</body>
</html>
