<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>BTS Quiz</title>

<link rel="icon" href="1609222921_8875.jpg">

<style>


body{
background:#6a0dad;
color:white;
font-family:"Microsoft JhengHei";
text-align:center;
padding-top:100px;
}

.retry-btn{
    margin:15px;
    padding:15px 35px;
    background:white;
    color:#6a0dad;
    border:none;
    border-radius:30px;
    font-size:20px;
    cursor:pointer;
    transition:0.3s;
}

.retry-btn:hover{
    transform:scale(1.05);
}
</style>
</head>

<body>

<h1>測驗完成！💜</h1>

<h2 id="score"></h2>

<h2 id="level"></h2>

<button onclick="restartQuiz()" class="retry-btn">
💜 再測一次 💜
</button>

<button onclick="location.href='index.html'" class="retry-btn">
🏠 回首頁
</button>

<script>

const score =
Number(localStorage.getItem("score"));

const percent =
Math.round(score / 20 * 100);

document.getElementById("score").innerHTML =
`
<h2>你的分數：${score} / 20</h2>
<h3>答對率：${percent}%</h3>
`;

let level="";

if(score>=18)
level="👑 超級 ARMY 👑";

else if(score>=15)
level="💜💜 資深 ARMY 💜💜";

else if(score>=10)
level="💜 普通 ARMY 💜";

else if(score>=6)
level="💜 新手 ARMY";

else
level="🤣 再去補物料吧";

document.getElementById("level").innerHTML =
level;

function restartQuiz(){

    localStorage.removeItem("score");

    location.href = "quiz.html";

}
</script>

</body>
</html>
